services:
  - type: web
    name: vankah-garage-backend
    env: python
    region: oregon
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vankah-postgres-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL
        value: "True"

databases:
  - name: vankah-postgres-db
    plan: free
    region: oregon
    databaseName: vankah_erp
    user: vankah_admin
